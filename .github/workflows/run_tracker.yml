name: Book Outlet Monitor

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes automatically
  workflow_dispatch: # Allows you to run it manually with a button click

jobs:
  check-books:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Scraper Script
      env:
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: python scraper.py

    - name: Commit Updated Book List
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add stored_books.txt || true
        git commit -m "Update tracked books cache" || true
        git push || true
